<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>bat-cli linker</title>
    <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  </head>
  <body>
    <script>
      // The board loads this file in the background and expects the app to say
      // what happens when its icon is clicked. Everything the user sees is in
      // panel.html.
      miro.board.ui.on('icon:click', async () => {
        await miro.board.ui.openPanel({ url: 'panel.html' });
      });
    </script>
  </body>
</html>
