<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>bat-cli linker</title>
    <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 14px/1.5 -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: 20px;
      }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p { margin: 0 0 16px; opacity: 0.75; }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #4262ff;
        color: #fff;
        cursor: pointer;
      }
      button[disabled] { opacity: 0.5; cursor: default; }
      #log {
        margin-top: 16px;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Link the cards</h1>
    <p>
      Turns every card bat-cli left on this board into a real Miro link, the kind
      with the arrow, so clicking one jumps to that function's frame.
    </p>
    <button id="run">Link the cards</button>
    <div id="log"></div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
